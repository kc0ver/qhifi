name: Release

# Release pipeline for a signed Android release APK.
#
# QHIFI maintains Android only, so the upstream desktop packaging jobs (Linux
# AppImage / Windows installer / macOS dmg) were removed: they failed on two of
# the three runners and, with no desktop build of this fork to ship, only spent
# runner time. The upstream shared `tests` job is likewise not wired in: it runs
# the desktop-host suite, which this fork does not ship (that suite still runs
# from tests.yml on every push to master as a merge-regression gate).
#
# Following upstream's layout, the build job only uploads a workflow artifact and
# a single `publish` job attaches it to the GitHub Release once the build
# succeeded, so a tag never becomes visible with a missing/broken APK.
#
# Triggers on BOTH ways of cutting a release, so either works:
#   • `git push` of a `v*` tag           → push event
#   • "Publish release" in the GitHub UI → release:published event
# (a UI-created release does not reliably emit a tag push event, so we need both).
# A manual `workflow_dispatch` run uploads artifacts only, unless `release_tag` is
# given: it then creates that tag at the run's commit and publishes there. Its
# tag is created with GITHUB_TOKEN, so it does not trigger a second full run.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish the built APK as this release tag (created at the run's
          commit), e.g. a prerelease. Empty uploads artifacts only.
        required: false
        default: ''
        type: string

# Push-a-tag and publish-a-release can both fire for the same version; collapse
# them into one run per ref instead of building everything twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      QPLAYER_STORE_PASSWORD: ${{ secrets.QPLAYER_STORE_PASSWORD }}
      QPLAYER_KEY_ALIAS: ${{ secrets.QPLAYER_KEY_ALIAS }}
      QPLAYER_KEY_PASSWORD: ${{ secrets.QPLAYER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Explicit Maven cache (the qml4j source build + player-core install + their
      # deps land in ~/.m2). setup-gradle below handles the Gradle caches itself.
      # Keyed per job like upstream, so a future job sharing this cache cannot
      # race to save it and leave the loser's dependencies uncached.
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-android-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-android-

      - uses: gradle/actions/setup-gradle@v4

      - uses: ./.github/actions/build-engine

      # player-core now carries the host-drawn lyric classes (shared-lyric was
      # merged in), so installing it is enough for the gradle build to resolve.
      - name: Install player-core
        run: |
          mvn -q -B -N install
          mvn -q -B -DskipTests install -f player-core/pom.xml

      - name: Decode keystore
        env:
          QPLAYER_KEYSTORE_BASE64: ${{ secrets.QPLAYER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$QPLAYER_KEYSTORE_BASE64" ]; then
            echo "$QPLAYER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qplayer.jks"
            echo "QPLAYER_KEYSTORE=$RUNNER_TEMP/qplayer.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded; release will be signed."
          else
            echo "::warning::QPLAYER_KEYSTORE_BASE64 not set — release will be UNSIGNED."
          fi

      - name: Build release APK
        run: |
          chmod +x android-shell/gradlew
          cd android-shell && ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Stage APK
        # The file carries the release tag so a downloaded APK identifies itself;
        # a manual dispatch without release_tag falls back to the branch name.
        env:
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          mkdir -p out
          dir=android-shell/app/build/outputs/apk/release
          apk="$dir/app-release.apk"
          [ -f "$apk" ] || apk="$dir/app-release-unsigned.apk"
          [ -n "$TAG" ] || TAG=unreleased
          cp "$apk" "out/QHIFI-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: QHIFI-android
          path: out/*

  publish:
    needs: [android]
    # github.ref is unreliable for release:published when the tag is auto-created
    # from the UI (lands as refs/heads/master instead of refs/tags/<tag>), so check
    # the event name and pass the release tag explicitly. A manual run publishes
    # only when given a release_tag.
    if: >-
      !cancelled()
      && needs.android.result == 'success'
      && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
          || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: QHIFI-*
          path: out
          merge-multiple: true

      - name: Check the expected APK is present
        run: |
          ls -l out
          [ -s "out/QHIFI-${RELEASE_TAG}.apk" ] || { echo "::error::missing QHIFI-${RELEASE_TAG}.apk"; exit 1; }

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          # Only upstream-style prerelease tags are marked as such. Every QHIFI
          # tag carries the "-hifi" suffix, so matching any '-' would mark stable
          # releases prerelease and hide them from releases/latest (the app's
          # update check reads that endpoint).
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc.') || contains(env.RELEASE_TAG, '-alpha') || contains(env.RELEASE_TAG, '-beta') }}
          # Curated notes live beside the workflow; update them before each release.
          body_path: ${{ github.workspace }}/.github/release-notes.md

      # Reusing an existing release (e.g. re-tagging the same version) can leave
      # the old body in place even with body_path set; write the curated notes
      # once more after the upload so the published body always matches the tag.
      - name: Sync release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --notes-file .github/release-notes.md
